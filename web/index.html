<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTR on Dust 2</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #status { position: fixed; left: 12px; bottom: 10px; opacity: .8; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status">Loading…</div>
<script>
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('canvas');
  const params = new URLSearchParams(location.search);
  const say = (msg) => { statusEl.textContent = msg; };

  async function fetchWithProgress(url, label) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
    const total = Number(res.headers.get('content-length')) || 0;
    const reader = res.body.getReader();
    const out = total ? new Uint8Array(total) : null;
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (out) out.set(value, got); else chunks.push(value);
      got += value.length;
      if (total) say(`${label} ${Math.round((got / total) * 100)}%`);
    }
    if (out) return out;
    const all = new Uint8Array(got);
    let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    return all;
  }

  // ?level=N&mode=0|1|2&character=N&laps=N boots straight into a race (see engine/platform/native_web.c).
  const boot = params.has('level') ? {
    level: Number(params.get('level')), mode: Number(params.get('mode') ?? 0),
    character: Number(params.get('character') ?? 0), laps: Number(params.get('laps') ?? 3),
  } : null;

  var Module = {
    canvas,
    ctrBoot: boot,
    noInitialRun: true,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    onRuntimeInitialized() { start().catch((e) => { say(String(e)); console.error(e); }); },
  };

  // Test hooks: what the game is doing, and a pad held down by code (engine/platform/native_web.c).
  const BUTTONS = { select: 0x1, start: 0x8, up: 0x10, right: 0x20, down: 0x40, left: 0x80,
    l2: 0x100, r2: 0x200, l1: 0x400, r1: 0x800, triangle: 0x1000, circle: 0x2000, cross: 0x4000, square: 0x8000 };
  function installHooks() {
    const buf = Module._malloc(32 * 4);
    window.ctr = {
      BUTTONS,
      state() {
        Module._NativeWeb_GetState(buf);
        const v = Module.HEAP32.subarray(buf >> 2, (buf >> 2) + 32);
        const s = { level: v[0], gameMode1: v[1] >>> 0, players: v[2], loadStage: v[3], vblank: v[21], eventTime: v[20],
          primUsed: v[27], primCapacity: v[28] };
        if (v[4]) {
          s.kart = { x: v[5] / 256, y: v[6] / 256, z: v[7] / 256, rot: [v[8], v[9], v[10]], speed: v[11], speedApprox: v[12],
            state: v[13], lap: v[14], quad: v[15], touching: v[16], lastValid: v[17], actions: v[18] >>> 0,
            distToFinish: v[19], terrain: v[22], angle: v[23], jump: v[24], reserves: v[25], checkpoint: v[26],
            item: v[29], wumpa: v[30], rank: v[31] };
        }
        return s;
      },
      hold(...names) { Module._NativeWeb_SetButtons(names.reduce((m, n) => m | (BUTTONS[n] ?? n), 0)); },
      release() { Module._NativeWeb_SetButtons(0); },
      teleport(x, y, z, angle = 0) { Module._NativeWeb_Teleport(x | 0, y | 0, z | 0, angle | 0); },
      turbo(on) { Module.ctrTurbo = !!on; },
    };
  }

  // Dust 2 takes Dingo Canyon's slot (level 0): its LEV replaces the 1P, 2P, 4P and
  // Time Trial/Relic files (BIGFILE entries 1, 3, 5, 7), and its textures go in the atlas
  // the renderer samples for tpage mode 3 ("CTRA", width, height, RGBA).
  async function loadDust2() {
    const base = params.get('dust2dir') || 'lev/';
    const meta = await (await fetch(base + 'dust2.json', { cache: 'no-store' })).json();
    const lev = await fetchWithProgress(base + 'dust2.lev', 'Dust 2');
    Module.FS.mkdirTree('/assets/override');
    for (const entry of ['001', '003', '005', '007']) Module.FS.writeFile(`/assets/override/${entry}.bin`, lev);
    const jpg = await fetchWithProgress(base + meta.atlas.image, 'Textures');
    const bitmap = await createImageBitmap(new Blob([jpg], { type: 'image/jpeg' }));
    const { width, height } = bitmap;
    const cv = new OffscreenCanvas(width, height);
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(bitmap, 0, 0);
    const pixels = cx.getImageData(0, 0, width, height).data;
    const file = new Uint8Array(12 + pixels.length);
    new DataView(file.buffer).setUint32(0, 0x41525443, true);
    new DataView(file.buffer).setUint32(4, width, true);
    new DataView(file.buffer).setUint32(8, height, true);
    file.set(pixels, 12);
    Module.FS.mkdirTree('/assets/dust2');
    Module.FS.writeFile('/assets/dust2/atlas.rgba', file);
    window.ctrDust2 = meta;
  }

  async function start() {
    const disc = await fetchWithProgress(params.get('disc') || 'game-data/ctr-u.bin', 'Disc');
    Module.FS.mkdir('/assets');
    Module.FS.writeFile('/assets/ctr-u.bin', disc);
    if (params.has('dust2')) await loadDust2();
    for (const extra of (params.get('files') || '').split(',').filter(Boolean)) {
      // extra=SRC_URL:DEST_PATH, e.g. lev/dust2.lev:/assets/mods/dust2.lev
      const [src, dst] = extra.split(':');
      const bytes = await fetchWithProgress(src, src);
      const dir = dst.slice(0, dst.lastIndexOf('/'));
      Module.FS.mkdirTree(dir);
      Module.FS.writeFile(dst, bytes);
    }
    say('');
    canvas.focus();
    installHooks();
    Module.callMain([]);
  }
</script>
<script src="ctr.js"></script>
</body>
</html>
